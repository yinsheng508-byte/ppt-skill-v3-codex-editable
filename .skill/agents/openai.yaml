interface:
  display_name: "PPT Skill v3"
  short_description: "稳定调用名 ppt-skill-v3；默认阶段0到阶段4做中文PPT，/canva 或 /可画 走国际版 Canva 阶段外辅助编辑：WorkBuddy 用 MCP，Codex 用插件。"
  default_prompt: "Use $ppt-skill-v3 默认按阶段0资料整理、阶段1规划确认、阶段2图片版PDF、阶段3逐字稿与教案输出、阶段4文件整理交付完成 PPT 项目；/canva 或 /可画 只作为国际版 Canva 辅助编辑，先按宿主和实际工具选择 MCP 或插件，由 AI 主控逐页理解页面角色、校验权威文案和视觉参考，默认 5 页一批，回读文案与预览通过后直接提交允许范围内的修订。"
policy:
  allow_implicit_invocation: true
