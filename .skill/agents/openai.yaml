interface:
  display_name: "PPT Skill v3"
  short_description: "中文PPT制作与交付；/动画、/加动画 原位加动画保留内容；/canva 国际版MCP辅助编辑。"
  default_prompt: "Use $ppt-skill-v3 默认按阶段0资料整理、阶段1规划确认、阶段2图片版PDF、阶段3逐字稿与教案输出、阶段4文件整理交付完成 PPT 项目；/动画、/加动画 自动定位 PPT，原位加动画且所有文字与元素不变，题目先见、点击出答案；/canva 或 /可画 只作为国际版 Canva MCP 辅助编辑，Codex与WorkBuddy统一检查MCP工具与授权，不回退插件或浏览器，由 AI 主控逐页理解页面角色、校验权威文案和视觉参考，默认 5 页一批，回读文案与预览通过后直接提交允许范围内的修订。"
policy:
  allow_implicit_invocation: true
